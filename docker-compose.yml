---
services:
  backend:
    build: ./backend
    container_name: smb-manager-backend
    environment:
      - ADMIN_TOKEN=change-this-to-a-strong-password
      - SMB_SERVER_NAME=SMB-SERVER
      - DATA_ROOT=/srv/samba
      - STATE_FILE=/state/state.json
    volumes:
      - /mnt/samba:/srv/samba
      - ./samba:/etc/samba
      - ./samba-lib:/var/lib/samba
      - ./state:/state
    ports:
      - 445:445
      - 139:139
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smb-manager-frontend
    ports:
      - 8080:80
    depends_on:
      - backend
    restart: unless-stopped
services:
  backend:
    image: ghcr.io/podpeedami/smb-managerkdv-backend:latest
    container_name: smb-manager-backend
    restart: unless-stopped

    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SMB_SERVER_NAME: ${SMB_SERVER_NAME:-SMB-SERVER}

    volumes:
      - /mnt/samba:/srv/samba
      - ./samba:/etc/samba
      - ./samba-lib:/var/lib/samba
      - ./state:/state

    ports:
      - "8000:8000"
      - "445:445"
      - "139:139"

  frontend:
    image: ghcr.io/podpeedami/smb-managerkdv-frontend:latest
    container_name: smb-manager-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend